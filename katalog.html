
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Musik Tradisional Lombok</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/katalog.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">

            <a href="index.html" class="logo">
                LOMBOK<span>MUSIK.</span>
            </a>

            <!-- TOMBOL HAMBURGER -->
            <button class="menu-toggle" id="menuToggle"
                    aria-label="Buka menu navigasi"
                    aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- MENU NAVIGASI -->
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html">Katalog</a></li>
                <li><a href="audio.html">Audio</a></li>
                <li><a href="galeri.html">Galeri</a></li>
                <li><a href="kuis.html">Kuis</a></li>
                <li><a href="tentang.html">Tentang</a></li>
            </ul>

        </div>
    </nav>


    <!-- KATALOG -->
    <section class="catalog-section">

        <div class="catalog-heading">
            <span>JELAJAHI WARISAN BUDAYA</span>

            <h1>Katalog Musik Tradisional Lombok</h1>

            <p>
                Kenali berbagai alat musik tradisional masyarakat
                Sasak beserta karakteristik dan keunikannya.
            </p>
        </div>


        <!-- FITUR PENCARIAN DAN FILTER -->
        <div class="catalog-filter">

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari nama alat musik..."
                >
            </div>

            <div class="filter-box">
                <select id="filterJenis">
                    <option value="semua">Semua Jenis Alat Musik</option>
                    <option value="Perkusi">Perkusi</option>
                    <option value="Getar">Getar</option>
                    <option value="Tiup">Tiup</option>
                </select>
            </div>

        </div>


        <!-- KARTU KATALOG OTOMATIS -->
        <div class="catalog-grid" id="catalog-list">
            <!-- Data alat musik ditampilkan melalui JavaScript -->
        </div>

    </section>


    <!-- FOOTER -->
    <footer style="background:#123f34;color:white;text-align:center;padding:25px;">
        <h3>LOMBOK MUSIK.</h3>
        <p>Ensiklopedia Interaktif Musik Tradisional Lombok</p>
    </footer>


    <!-- JAVASCRIPT HAMBURGER -->
    <script>
        const menuToggle = document.getElementById("menuToggle");
        const navLinks = document.getElementById("navLinks");

        menuToggle.addEventListener("click", function () {
            navLinks.classList.toggle("active");

            const isOpen = navLinks.classList.contains("active");
            menuToggle.setAttribute("aria-expanded", isOpen);
        });
    </script>

    <!-- DATA DAN FUNGSI KATALOG -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
